limit_req_zone $server_name zone=bhb:10m rate=40r/s;

server {
	listen 443 ssl;
	listen [::]:443 ssl;

	root /srv/www/bhb.example.com;

	index index.html;

	server_name bhb.example.com;

	ssl_certificate /var/lib/dehydrated/certs/bhb.example.com/fullchain.pem;
	ssl_certificate_key /var/lib/dehydrated/certs/bhb.example.com/privkey.pem;
	ssl_protocols TLSv1.3 TLSv1.2 TLSv1.1;
	ssl_prefer_server_ciphers on;
	ssl_ciphers "HIGH:!aNULL:-RSA:+ECDHE-PSK-AES256-CBC-SHA384:-CBC";
	ssl_session_cache shared:SSL:50m;
	ssl_session_timeout 5m;
	add_header 'Strict-Transport-Security' "max-age=31556926";

	location /api/ {
		limit_req zone=bhb burst=50;

		if ($request_method = 'OPTIONS') {
			add_header Access-Control-Allow-Origin "*" always;
			add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
			add_header 'Content-Type' 'text/plain; charset=utf-8';
			add_header 'Content-Length' 0;
			return 204;
		}
		proxy_pass "https://app.buchhaltungsbutler.de/api/";
		proxy_set_header Host app.buchhaltungsbutler.de;
		proxy_ssl_name app.buchhaltungsbutler.de;
		proxy_ssl_server_name on;
	}
}
